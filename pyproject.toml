[project]
name = "aether-nano"
version = "1.1.0"
description = "Deterministic rule engine and strategy DSL for AI agents and quantitative systems — compile, replay, and audit every decision."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aether AI LLC" }]
keywords = [
  "nano", "aether", "compiler", "deterministic-execution", "dsl",
  "quantitative-trading", "algorithmic-trading", "execution-engine", "provenance",
  "static-typing", "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Zero mandatory dependencies -- stdlib only, matching the reference runtime.
# The CLI is argparse, csv, and json; the type checker, indicators, and VM add
# nothing. A strategy compiler that pulls in a dependency tree is a compiler
# whose output depends on that tree resolving identically twice.
dependencies = []

[project.scripts]
nano = "nano.cli.main:main"
nano-qsearch-serve = "nano_qsearch.service:main"

[project.urls]
Homepage = "https://aethersystems.net"
"Aether Code (web IDE)" = "https://app.aethersystems.net/code"
Repository = "https://github.com/AetherAI3/Nano"
Documentation = "https://github.com/AetherAI3/Nano/tree/main/docs"
Issues = "https://github.com/AetherAI3/Nano/issues"
Changelog = "https://github.com/AetherAI3/Nano/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Signed, non-repudiable audit receipts over decision-gate records.
# See nano/bridge/provenance.py.
provenance = ["aether-protocol-c"]
# Q-search service engines (Qiskit Aer statevector / MPS). The service itself is
# stdlib; only the child-process engine imports these. ATLAS is loaded by path
# (NANO_QSEARCH_ATLAS_PATH) and is not on PyPI. See docs/qsearch-service.md.
quantum = ["qiskit==2.3.1", "qiskit-aer==0.17.2", "numpy>=1.26"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "engine: needs qiskit-aer and aether_atlas (system Python, run from PowerShell on Windows)",
  "integration: needs NANO_QSEARCH_PREDATOR_PATH pointing at a Predator-M checkout",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nano*"]

# The source/IR conformance and strategy corpora live alongside the package.
# Ship them deliberately so installed distributions retain the documented assets.
[tool.setuptools.package-data]
nano = [
  "examples/*.nano",
  "examples/*.json",
  "library/*/*.nano",
  "library/*/*.json",
  "intent/schemas/*.json",
  "intent/fixtures/*.json",
  "project/fixtures/*.json",
  "project/schemas/*.json",
]
