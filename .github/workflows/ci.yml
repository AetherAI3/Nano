name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q

  contribution-shape:
    # The test suite proves a library entry compiles to its pinned IR. It says
    # nothing about the IR file's house formatting or the comment header every
    # entry carries, and both had already drifted — six risk/ entries shipped
    # with the compiler's default JSON indentation instead of the library's.
    # A contributor should learn this from a command, not from review.
    name: Contribution shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e .
      - name: Check every library entry
        run: python scripts/check_contribution.py --all

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify packaged strategy and project assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          expected = {
              path.as_posix()
              for root in (Path("nano/examples"), Path("nano/library"), Path("nano/project"))
              for path in root.rglob("*")
              if path.suffix in {".nano", ".json"}
          }
          with ZipFile(wheel) as archive:
              packaged = set(archive.namelist())

          missing = sorted(expected - packaged)
          assert not missing, f"wheel is missing documented assets: {missing}"

          required_modules = {
              "nano/library/__init__.py",
              "nano/library/catalog.py",
              "nano/library/contribution.py",
              "nano/project/__init__.py",
              "nano/project/catalog.py",
              "nano/project/records.py",
              "nano/project/query.py",
              "nano/project/index.py",
              "nano/project/cli.py",
          }
          missing_modules = sorted(required_modules - packaged)
          assert not missing_modules, (
              f"wheel is missing required modules: {missing_modules}"
          )
          PY
      - name: Verify installed library and project discovery
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl")).resolve()
          with tempfile.TemporaryDirectory() as outside_checkout:
              subprocess.run(
                  [
                      sys.executable,
                      "-I",
                      "-c",
                      (
                          "import sys; "
                          f"sys.path.insert(0, {str(wheel)!r}); "
                          "from nano.library.contribution import "
                          "baseline_control_frames, module_control_frame, "
                          "source_provenance_issues; "
                          "from nano.library.catalog import "
                          "catalog_diagnostics, load_catalog; "
                          "assert baseline_control_frames.__module__ == "
                          "'nano.library.contribution'; "
                          "catalog = load_catalog(); "
                          "assert catalog['strategyCount'] == 55; "
                          "assert catalog_diagnostics() == (); "
                          "import json; from importlib.resources import files; "
                          "from nano.project import ProjectIndex; "
                          "data = files('nano.project').joinpath('fixtures/records.json').read_text(); "
                          "result = ProjectIndex(json.loads(data)).search("
                          "'frontend css pending review', project_id='example-project'); "
                          "assert [x['recordId'] for x in result['items']] == ['pr:9001:41']"
                      ),
                  ],
                  cwd=outside_checkout,
                  check=True,
              )
          PY
