name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q

  contribution-shape:
    # The test suite proves a library entry compiles to its pinned IR. It says
    # nothing about the IR file's house formatting or the comment header every
    # entry carries, and both had already drifted — six risk/ entries shipped
    # with the compiler's default JSON indentation instead of the library's.
    # A contributor should learn this from a command, not from review.
    name: Contribution shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e .
      - name: Check every library entry
        run: python scripts/check_contribution.py --all

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify packaged strategy assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          expected = {
              path.as_posix()
              for root in (Path("nano/examples"), Path("nano/library"))
              for path in root.rglob("*")
              if path.suffix in {".nano", ".json"}
          }
          with ZipFile(wheel) as archive:
              packaged = set(archive.namelist())

          missing = sorted(expected - packaged)
          assert not missing, f"wheel is missing documented strategy assets: {missing}"

          required_modules = {
              "nano/library/__init__.py",
              "nano/library/contribution.py",
          }
          missing_modules = sorted(required_modules - packaged)
          assert not missing_modules, (
              f"wheel is missing library validation modules: {missing_modules}"
          )
          PY
      - name: Verify installed library validation imports
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl")).resolve()
          with tempfile.TemporaryDirectory() as outside_checkout:
              subprocess.run(
                  [
                      sys.executable,
                      "-I",
                      "-c",
                      (
                          "import sys; "
                          f"sys.path.insert(0, {str(wheel)!r}); "
                          "from nano.library.contribution import "
                          "baseline_control_frames, module_control_frame, "
                          "source_provenance_issues; "
                          "assert baseline_control_frames.__module__ == "
                          "'nano.library.contribution'"
                      ),
                  ],
                  cwd=outside_checkout,
                  check=True,
              )
          PY
