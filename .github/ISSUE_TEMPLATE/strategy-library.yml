name: Strategy or watchdog rule proposal
description: Propose a well-specified rule - trading strategy or deterministic watchdog - for Nano's paired source/IR library.
title: "[strategy]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping grow the Nano rule library. A proposal describes a signal contract for a host to provide; it is not investment advice or a request for live execution.

        New here? [Walk through a first contribution](https://github.com/AetherAI3/Nano/blob/main/docs/first-contribution.md) - the whole path once, with a real rule.

        Watchdog rules read host-measured system or policy state rather than markets, emit `pause` and `observe` only, and follow the same nonnegative rises-as-it-worsens direction convention as `risk/`.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - momentum
        - mean_reversion
        - trend
        - volatility
        - volume
        - risk
        - event_volatility
        - watchdog (system or policy state, not markets)
        - new category proposal
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Proposed strategy name
      description: Use a concise, lowercase_snake_case name for the future file pair.
      placeholder: rsi_oversold_reversal
    validations:
      required: true
  - type: textarea
    id: thesis
    attributes:
      label: Strategy thesis
      description: Explain the trading idea in plain language and the intended timeframe.
    validations:
      required: true
  - type: textarea
    id: signals
    attributes:
      label: Host signal contract
      description: For every signal, give its formula/data source, unit or range, normalization, lookback convention, and threshold direction.
      placeholder: "RSI(14): host-computed RSI, 0-100; emit only when RSI < 30."
    validations:
      required: true
  - type: textarea
    id: proposed_source
    attributes:
      label: Proposed Nano source
      description: Draft a v0.1-compatible strategy, if possible. Nano currently supports one schedule, one rule, AND-chained conditions, and five intent actions.
      render: nano
  - type: textarea
    id: intent
    attributes:
      label: Proposed intent
      description: State the action, asset convention, and confidence (if any) the strategy should emit.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Proposal checklist
      options:
        - label: I understand that Nano emits intents and does not place trades or provide investment advice.
          required: true
        - label: I will include paired .nano and _ir.json files plus documented signal conventions in a pull request.
          required: true
        - label: I will run python scripts/check_contribution.py and python -m pytest tests/test_library.py -q before requesting review.
          required: true
